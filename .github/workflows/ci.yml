name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v8
      - name: Use Node.js 26
        uses: actions/setup-node@v8
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v8
      - name: Use Node.js 26
        uses: actions/setup-node@v8
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run web:build
