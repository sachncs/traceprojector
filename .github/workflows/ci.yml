name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - name: Smoke-test the built ESM bundle
        run: |
          node --input-type=module -e "
            import { Mesh, Whitney, Projector } from './dist/traceprojector.esm.js'
            const mesh = new Mesh([[0,0,0],[1,0,0],[0,1,0],[0,0,1]], [[0,1,2,3]])
            const w = new Whitney(mesh)
            new Projector(mesh, w, { quadratureOrder: 3 }).computeBoundaryWeights()
            console.log('ESM bundle OK')
          "
      - name: Check ESM, CJS and UMD bundles export the same names
        run: node scripts/check-dist-exports.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run site:build
