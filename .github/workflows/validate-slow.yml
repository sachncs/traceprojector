name: Slow validation

# The higher-order projection runs dense local solves and takes about half an
# hour, so it is checked weekly and on demand rather than on every pull request.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Weights, correction and projection of degree p + 1
        run: npm run validate:slow
