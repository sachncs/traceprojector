name: Slow validation and benchmarks

# The higher-order projection takes tens of minutes, so it is checked weekly
# and on demand rather than on every pull request, together with the
# benchmarks, whose timings are compared with the committed baseline in units
# of a calibration loop so that they are comparable across machines.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Weights, correction and projection of degree p + 1
        run: npm run validate:slow
      - name: Benchmarks against the baseline
        run: npm run bench:check
      - name: Keep the benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: reports/bench.json
