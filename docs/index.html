<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>traceprojector</title>
  <meta name="description" content="Bounded, Commuting, Discrete-trace Preserving Projections for the 3D de Rham complex on simplicial meshes. Pure JavaScript, MIT-licensed, open source.">
  <style>
    :root {
      --bg: #0a0e18;
      --fg: #e6edf3;
      --accent: #a78bfa;
      --accent2: #67e8f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.6;
    }
    main { max-width: 720px; text-align: center; }
    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    p.tagline { color: #b0b8c5; margin-bottom: 2rem; font-size: 1.1rem; }
    pre {
      background: #131826;
      padding: 1rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: left;
      overflow-x: auto;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    a.btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
    }
    a.btn.alt { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>traceprojector</h1>
    <p class="tagline">Bounded, Commuting, Discrete-trace Preserving Projections<br>for the 3D de Rham complex on simplicial meshes.</p>
    <pre><code>npm install traceprojector</code></pre>
    <div class="links">
      <a class="btn" href="https://github.com/sachncs/traceprojector">GitHub repo</a>
      <a class="btn alt" href="https://www.npmjs.com/package/traceprojector">npm</a>
      <a class="btn alt" href="https://github.com/sachncs/traceprojector/discussions">Discussions</a>
    </div>
    <p style="margin-top:3rem; color:#6b7280; font-size:0.9rem;">
      Pure JavaScript, MIT-licensed, zero runtime dependencies.
    </p>
  </main>
</body>
</html>
